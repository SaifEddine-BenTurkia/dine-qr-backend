# /etc/nginx/sites-available/menu-api.arishub.site
#
# TLS uses a Cloudflare Origin Certificate (SSL/TLS -> Origin Server in the
# Cloudflare dashboard), with the hostname's SSL mode set to Full (strict).
# Cloudflare is the only client that ever connects here: the firewall accepts
# 80/443 from Cloudflare's ranges alone.
#
# Zone names are prefixed "tableqr_" because limit_req_zone is global to nginx
# and ArisHub may define its own zones on this host.
#
# Keyed on CF-Connecting-IP: $remote_addr is a Cloudflare edge server shared by
# many visitors. The header can only be trusted because of that firewall rule.
limit_req_zone $http_cf_connecting_ip zone=tableqr_auth:10m rate=10r/m;
limit_req_zone $http_cf_connecting_ip zone=tableqr_api:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name menu-api.arishub.site;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name menu-api.arishub.site;

    ssl_certificate     /etc/ssl/cloudflare/arishub.site.pem;
    ssl_certificate_key /etc/ssl/cloudflare/arishub.site.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    limit_req_status 429;

    # Hard edge limit on credential and email endpoints; the API applies its
    # own per-visitor limits behind this.
    location ~ ^/auth/(login|register|forgot-password|reset-password|resend-verification)$ {
        limit_req zone=tableqr_auth burst=5 nodelay;
        include /etc/nginx/snippets/tableqr-proxy.conf;
        client_max_body_size 64k;
    }

    location / {
        limit_req zone=tableqr_api burst=60 nodelay;
        include /etc/nginx/snippets/tableqr-proxy.conf;
        # Image uploads are capped at 5 MB by the API.
        client_max_body_size 6m;
        # AI menu import can take up to ~90 s.
        proxy_read_timeout 120s;
    }
}
