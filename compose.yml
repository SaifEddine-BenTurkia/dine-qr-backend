# Local development database. Run the API itself with `npm run start:dev`.
name: tableqr-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tableqr
      POSTGRES_USER: tableqr
      POSTGRES_PASSWORD: tableqr
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tableqr -d tableqr"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
